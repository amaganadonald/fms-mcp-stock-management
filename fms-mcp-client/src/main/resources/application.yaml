server:
  port: 9001
spring:
  application:
    name: fms-ai-client

  ai:
    mcp:
      client:
        type: sync
        sse:
          connections:
            stock-server:
              sse-endpoint: /sse
              url: http://localhost:9000
    openai:
      api-key:
      base-url: https://api.openai.com/v1
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.2
          max-tokens: 1024
          top-p: 1.0
          frequency-penalty: 0
          presence-penalty: 0
